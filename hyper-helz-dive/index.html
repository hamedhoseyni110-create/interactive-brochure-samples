<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هایپرهلس — پرده ۱: فرود</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ffffff; font-family: Tahoma, sans-serif; }
  body { height: 300vh; }
  #scene {
    position: fixed; inset: 0; width: 100vw; height: 100dvh;
    display: block; pointer-events: none;
  }
  .overlay {
    position: fixed; left: 0; right: 0; text-align: center;
    pointer-events: none; z-index: 5; padding: 0 20px;
  }
  #hero { top: 12vh; }
  #hero h1 { font-size: clamp(34px, 9vw, 64px); color: #1a1a1a; font-weight: 700; }
  #hero p { margin-top: 10px; font-size: clamp(15px, 4vw, 22px); color: #555; }
  #act {
    top: 18px; font-size: 13px; color: #888; letter-spacing: 0;
  }
  #hint { bottom: 9vh; font-size: clamp(15px, 4vw, 20px); color: #333; }
  #hint span { display: inline-block; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
  #endnote { bottom: 12vh; font-size: clamp(15px, 4vw, 20px); color: #333; opacity: 0; }
  #progress {
    position: fixed; bottom: 0; right: 0; height: 3px; background: #f59e0b;
    width: 0%; z-index: 6;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.min.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div class="overlay" id="act">پرده ۱ — فرود</div>

<div class="overlay" id="hero">
  <h1>هایپرهلس</h1>
  <p>به فروشگاه سالم خوش آمدید</p>
</div>

<div class="overlay" id="hint">اسکرول کن <span>↓</span></div>
<div class="overlay" id="endnote">ادامه: پرده ۲ — راهرو</div>
<div id="progress"></div>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);

// ---- sketch material: white faces + black ink edges ----
const faceMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x111111 });

function sketchBox(w, h, d, x, y, z) {
  const g = new THREE.Group();
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), faceMat);
  mesh.position.set(x, y, z);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), edgeMat);
  edges.position.copy(mesh.position);
  g.add(mesh, edges);
  scene.add(g);
  return g;
}

// floor plan outline (P-shape) as a flat black line loop
function planLoop(points) {
  const pts = points.map(p => new THREE.Vector3(p[0], 0.02, p[1]));
  pts.push(pts[0].clone());
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.Line(geo, edgeMat));
}
// stem (x -5..5, z 10..26) + bowl (x -9..9, z -10..10)
planLoop([[-5,26],[5,26],[5,10],[9,10],[9,-10],[-9,-10],[-9,10],[-5,10]]);

// walls (height 3, thin) — south wall has the entrance gap
sketchBox(3.5, 3, 0.3, -3.25, 1.5, 26);   // south wall left of entrance
sketchBox(3.5, 3, 0.3,  3.25, 1.5, 26);   // south wall right of entrance
sketchBox(0.3, 3, 16, -5, 1.5, 18);       // stem west wall
sketchBox(0.3, 3, 16,  5, 1.5, 18);       // stem east wall
sketchBox(4, 3, 0.3, -7, 1.5, 10);        // bowl south wall west
sketchBox(4, 3, 0.3,  7, 1.5, 10);        // bowl south wall east
sketchBox(0.3, 3, 20, -9, 1.5, 0);        // bowl west wall
sketchBox(0.3, 3, 20,  9, 1.5, 0);        // bowl east wall
sketchBox(18, 3, 0.3,  0, 1.5, -10);      // bowl north wall

// racks: stem wall racks + bowl gondolas
sketchBox(1, 2.2, 8, -4.2, 1.1, 18);
sketchBox(1, 2.2, 8,  4.2, 1.1, 18);
sketchBox(1, 2.2, 12, -1.5, 1.1, 0);
sketchBox(1, 2.2, 12,  1.5, 1.1, 0);

// food island (bowl centre)
sketchBox(6, 1.1, 4, 0, 0.55, 0);

// checkout near entrance
sketchBox(1.2, 1.1, 1.2, 3.8, 0.55, 23.5);

// ---- watercolor blots (canvas radial gradients) ----
function blotTexture(inner, outer) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 10, 128, 128, 128);
  g.addColorStop(0, inner);
  g.addColorStop(1, outer);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}
function blot(x, z, r, tex, opacity) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(r * 2, r * 2),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity, depthWrite: false })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.06, z);
  scene.add(m);
  return m;
}
const entranceBlot = blot(0, 24, 2.6,
  blotTexture('rgba(245,158,11,0.55)', 'rgba(245,158,11,0)'), 1);
const islandBlot = blot(0, 0, 3.4,
  blotTexture('rgba(74,160,90,0.50)', 'rgba(74,160,90,0)'), 0);

// ---- scroll-driven camera path (waypoints) ----
const path = [
  { pos: [0, 38, 10],  look: [0, 0, 8] },    // top-down plan
  { pos: [0, 20, 30],  look: [0, 0, 10] },   // descending
  { pos: [0, 5, 30],   look: [0, 1.2, 6] },  // low approach
  { pos: [0, 1.7, 24.5], look: [0, 1.6, -6] }  // eye level at the entrance
];
const segEnds = [0.35, 0.7, 1.0];
function smooth(t) { return t * t * (3 - 2 * t); }
function cameraAt(t) {
  let i = 0;
  while (i < segEnds.length - 1 && t > segEnds[i]) i++;
  const t0 = i === 0 ? 0 : segEnds[i - 1];
  const lt = smooth(Math.min(1, Math.max(0, (t - t0) / (segEnds[i] - t0))));
  const a = path[i], b = path[i + 1];
  const pos = new THREE.Vector3(...a.pos).lerp(new THREE.Vector3(...b.pos), lt);
  const look = new THREE.Vector3(...a.look).lerp(new THREE.Vector3(...b.look), lt);
  return { pos, look };
}

const heroEl = document.getElementById('hero');
const hintEl = document.getElementById('hint');
const endEl = document.getElementById('endnote');
const progEl = document.getElementById('progress');

let target = 0, current = 0;
function scrollTarget() {
  const max = document.body.scrollHeight - window.innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  target = scrollTarget();
  current += (target - current) * 0.12;
  if (Math.abs(target - current) < 0.0005) current = target;

  const { pos, look } = cameraAt(current);
  camera.position.copy(pos);
  camera.lookAt(look);

  // entrance blot breathes; island blot blooms late in the dive
  const s = 1 + 0.06 * Math.sin(clock.getElapsedTime() * 2);
  entranceBlot.scale.set(s, s, 1);
  islandBlot.material.opacity = 0.55 * smooth(Math.min(1, Math.max(0, (current - 0.75) / 0.25)));

  // overlay fades
  heroEl.style.opacity = 1 - smooth(Math.min(1, Math.max(0, (current - 0.02) / 0.20)));
  hintEl.style.opacity = 1 - smooth(Math.min(1, Math.max(0, current / 0.10)));
  endEl.style.opacity = smooth(Math.min(1, Math.max(0, (current - 0.90) / 0.08)));
  progEl.style.width = (current * 100).toFixed(1) + '%';

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
