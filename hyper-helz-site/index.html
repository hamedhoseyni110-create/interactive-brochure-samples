<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>هایپر هلز — قدم‌زدن در فروشگاه</title>
  <script src="gsap.min.js"></script>
  <script src="ScrollTrigger.min.js"></script>
  <script src="lenis.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #f6f4ef; overflow-x: hidden; }
    body { font-family: Tahoma, sans-serif; color: #2b2620; }

    /* ---------- فیلم ---------- */
    #film-wrap { position: fixed; z-index: 0; background: #f6f4ef; }
    #stage { display: block; width: 100%; height: 100%; object-fit: cover; background: #f6f4ef; }
    #film-fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
      background: linear-gradient(to bottom, rgba(246,244,239,0), #f6f4ef);
      pointer-events: none;
    }
    /* موبایل: فیلم نیمه‌ی بالا */
    #film-wrap { inset: 0 0 auto 0; height: 55vh; }
    /* دسکتاپ: فیلم تمام‌صفحه */
    @media (min-width: 769px) {
      #film-wrap { inset: 0; height: 100%; }
      #film-fade { display: none; }
    }

    /* ---------- مسیر اسکرول ---------- */
    #scroll-spacer { position: relative; z-index: 1; height: 1800vh; }

    /* ---------- نوار ایستگاه‌ها ---------- */
    #station-bar {
      position: fixed; z-index: 60; top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.75); backdrop-filter: blur(8px);
      border: 1px solid rgba(43,38,32,0.12); border-radius: 99px;
      padding: 6px 12px; font-size: 12px; white-space: nowrap;
      box-shadow: 0 2px 12px rgba(43,38,32,0.10);
    }
    #station-bar .dot { width: 7px; height: 7px; border-radius: 50%; background: #c9c2b4; flex: none; }
    #station-bar .dot.on { background: #7a9b6d; }
    #station-bar .name { font-weight: 700; }
    @media (min-width: 769px) {
      #station-bar { left: 18px; top: 50%; transform: translateY(-50%); flex-direction: column; padding: 12px 8px; }
      #station-bar .name { display: none; }
      #station-bar .dot { width: 9px; height: 9px; }
    }

    /* ---------- کارت ایستگاه ---------- */
    #card {
      position: fixed; z-index: 50; left: 16px; right: 16px; bottom: 18px;
      background: rgba(255,255,255,0.82); backdrop-filter: blur(10px);
      border: 1px solid rgba(43,38,32,0.10); border-radius: 18px;
      padding: 18px 20px 16px; box-shadow: 0 8px 30px rgba(43,38,32,0.14);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #card.swap { opacity: 0; transform: translateY(8px); }
    #card .kicker { font-size: 11px; letter-spacing: 1px; color: #7a9b6d; font-weight: 700; margin-bottom: 4px; }
    #card h2 { font-size: 20px; line-height: 1.4; margin-bottom: 4px; }
    #card p { font-size: 13.5px; line-height: 1.9; color: #5c554a; margin-bottom: 12px; }
    #card button {
      font-family: Tahoma, sans-serif; font-size: 14px; font-weight: 700;
      background: #7a9b6d; color: #fff; border: none; border-radius: 99px;
      padding: 10px 20px; cursor: pointer;
    }
    @media (min-width: 769px) {
      #card { left: auto; right: 28px; bottom: 28px; width: 340px; }
    }

    /* ---------- لودر (روی کاغذ) ---------- */
    #loader {
      position: fixed; inset: 0; z-index: 100; background: #f6f4ef; color: #2b2620;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
    #loader .pct { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    #loader .label { font-size: 0.85rem; opacity: 0.6; letter-spacing: 1px; }
    #loader .bar { width: min(280px, 70vw); height: 3px; background: rgba(43,38,32,0.15); border-radius: 99px; overflow: hidden; }
    #loader .bar-fill { height: 100%; width: 0%; background: #7a9b6d; border-radius: 99px; transition: width 0.15s linear; }

    #progress { position: fixed; top: 0; right: 0; left: 0; height: 3px; z-index: 55; background: rgba(43,38,32,0.08); }
    #progress .fill { height: 100%; width: 0%; background: #7a9b6d; }
    /* ---------- قدم ۲: دکمه‌ی قدم‌زدن خودکار + سبد ---------- */
    #station-bar .sep { width: 1px; height: 18px; background: rgba(43,38,32,0.18); flex: none; }
    .bar-btn {
      font-family: Tahoma, sans-serif; font-size: 13px; font-weight: 700;
      background: #7a9b6d; color: #fff; border: none; border-radius: 99px;
      min-width: 30px; height: 30px; padding: 0 10px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      flex: none;
    }
    .bar-btn.off { background: #c9c2b4; color: #2b2620; }
    .bar-btn .badge {
      background: #fff; color: #7a9b6d; border-radius: 99px;
      min-width: 18px; height: 18px; font-size: 11px; line-height: 18px; text-align: center;
      padding: 0 4px;
    }
    /* کشوی سبد */
    #drawer-backdrop {
      position: fixed; inset: 0; z-index: 80; background: rgba(43,38,32,0.35);
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #drawer-backdrop.open { opacity: 1; visibility: visible; }
    #drawer {
      position: fixed; z-index: 90; top: 0; bottom: 0; right: 0; width: min(360px, 88vw);
      background: #f6f4ef; box-shadow: -8px 0 30px rgba(43,38,32,0.25);
      transform: translateX(105%); transition: transform 0.35s ease;
      display: flex; flex-direction: column;
    }
    #drawer.open { transform: translateX(0); }
    #drawer header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 12px; border-bottom: 1px solid rgba(43,38,32,0.12);
    }
    #drawer header h3 { font-size: 17px; }
    #drawer header button {
      font-family: Tahoma, sans-serif; font-size: 14px; background: none; border: none;
      cursor: pointer; color: #5c554a; padding: 6px 10px;
    }
    #drawer .body { flex: 1; overflow-y: auto; padding: 12px 20px; }
    .prod {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.75); border: 1px solid rgba(43,38,32,0.10);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
    }
    .prod .nm { flex: 1; font-size: 13.5px; line-height: 1.7; font-weight: 700; }
    .prod .nm small { display: block; font-weight: 400; color: #5c554a; font-size: 12px; }
    .qty { display: flex; align-items: center; gap: 8px; flex: none; }
    .qty button {
      font-family: Tahoma, sans-serif; font-size: 16px; font-weight: 700;
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid #7a9b6d;
      background: #fff; color: #7a9b6d; cursor: pointer;
    }
    .qty span { min-width: 18px; text-align: center; font-weight: 700; font-size: 14px; }
    #drawer footer { padding: 14px 20px 20px; border-top: 1px solid rgba(43,38,32,0.12); }
    #wa-btn {
      display: block; width: 100%; text-align: center; text-decoration: none;
      font-family: Tahoma, sans-serif; font-size: 15px; font-weight: 700;
      background: #25d366; color: #fff; border-radius: 99px; padding: 13px 20px;
    }
    #wa-btn.disabled { background: #c9c2b4; pointer-events: none; }
    #drawer .empty { color: #5c554a; font-size: 13.5px; line-height: 1.9; text-align: center; padding: 30px 10px; }
    #drawer .info-line { font-size: 13.5px; line-height: 2; color: #2b2620; padding: 6px 0; }
    #drawer .info-line b { color: #7a9b6d; }

  </style>
</head>
<body>

  <div id="film-wrap">
    <video id="stage" src="film-mobile.mp4" muted playsinline preload="auto"></video>
    <div id="film-fade"></div>
  </div>

  <div id="scroll-spacer"></div>

  <div id="station-bar">
    <span class="dot on"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="name" id="station-name">ورودی</span>
    <span class="sep"></span>
    <button class="bar-btn off" id="walk-btn" type="button" title="قدم‌زدن خودکار">▶</button>
    <button class="bar-btn" id="cart-btn" type="button" title="سبد خرید">🛒 <span class="badge" id="cart-count">۰</span></button>
  </div>

  <div id="drawer-backdrop"></div>
  <div id="drawer" role="dialog" aria-label="سبد خرید">
    <header>
      <h3 id="drawer-title">سبد خرید</h3>
      <button id="drawer-close" type="button">✕ بستن</button>
    </header>
    <div class="body" id="drawer-body"></div>
    <footer id="drawer-footer">
      <a id="wa-btn" class="disabled" href="#" target="_blank" rel="noopener">سفارش واتساپی</a>
    </footer>
  </div>

  <div id="card">
    <div class="kicker" id="card-kicker">ایستگاه ۱ از ۶</div>
    <h2 id="card-title">هایپر هلز اصفهان</h2>
    <p id="card-text">سوپرمارکت محصولات سالم، ارگانیک و رژیمی</p>
    <button id="card-btn" type="button">شروع گشت‌وگذار</button>
  </div>

  <div id="loader">
    <div class="pct" id="loader-pct">۰٪</div>
    <div class="bar"><div class="bar-fill" id="loader-bar"></div></div>
    <div class="label" id="loader-label">در حال آماده‌سازی…</div>
  </div>

  <div id="progress"><div class="fill" id="progress-fill"></div></div>

  <script>
  (function () {
    'use strict';

    const IS_MOBILE = window.innerWidth <= 768 ||
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    const CONFIG = {
      mobile:  { chunkSizes: [80, 80, 80, 80, 80, 80, 81], totalFrames: 561 },
      desktop: { chunkSizes: [80, 80, 80, 80, 80, 80, 81], totalFrames: 561 }, /* live: mobile frames for all (desktop upscales) */
      basePath: 'frames',
      globalFrameNumbering: true,
      focalX: 0.5,
      mobileZoom: 1.15,   /* زوم ملایم موبایل در حالت contain */
    };

    const PROFILE = IS_MOBILE ? CONFIG.mobile : CONFIG.desktop;
    const TOTAL = PROFILE.totalFrames;
    const CHUNK_SIZES = PROFILE.chunkSizes;

    /* ---------- ۶ ایستگاه — بازه‌ی فریم قفل‌شده (قدم ۳) ---------- */
    const STATIONS = IS_MOBILE ? [
      { name: 'ورودی',          kicker: 'ایستگاه ۱ از ۶', title: 'هایپر هلز اصفهان',   text: 'سوپرمارکت محصولات سالم، ارگانیک و رژیمی',            btn: 'شروع گشت‌وگذار',  from: 0,   to: 79 },
      { name: 'راهرو',          kicker: 'ایستگاه ۲ از ۶', title: 'قفسه‌های سلامت',      text: 'غلات کامل، عسل طبیعی و میان‌وعده‌های بدون قند',          btn: 'مشاهده محصولات',  from: 80,  to: 129 },
      { name: 'کافه',           kicker: 'ایستگاه ۳ از ۶', title: 'کافه سلامت',          text: 'قهوه‌ی تخصصی، اسموتی طبیعی و نوشیدنی رژیمی',            btn: 'منوی کافه',        from: 130, to: 199 },
      { name: 'نشیمن و پیانو',  kicker: 'ایستگاه ۴ از ۶', title: 'فضای آرامش',          text: 'بنشینید، بنوشید و از فضای گرم فروشگاه لذت ببرید',        btn: 'آدرس و ساعت کاری', from: 200, to: 319 },
      { name: 'قفسه‌های یخچالی', kicker: 'ایستگاه ۵ از ۶', title: 'تازه و روزانه',        text: 'لبنیات، نوشیدنی‌های سرد و پروتئین‌های تازه',              btn: 'سبد خرید',         from: 320, to: 399 },
      { name: 'جزیره',          kicker: 'ایستگاه ۶ از ۶', title: 'جزیره‌ی غذای سالم',   text: 'غذاهای گرم و سالادهای روزانه، آماده‌ی سرو',               btn: 'سفارش واتساپی',   from: 400, to: 560 },
    ] : [
      { name: 'ورودی',          kicker: 'ایستگاه ۱ از ۶', title: 'هایپر هلز اصفهان',   text: 'سوپرمارکت محصولات سالم، ارگانیک و رژیمی',            btn: 'شروع گشت‌وگذار',  from: 0,   to: 79 },
      { name: 'راهرو',          kicker: 'ایستگاه ۲ از ۶', title: 'قفسه‌های سلامت',      text: 'غلات کامل، عسل طبیعی و میان‌وعده‌های بدون قند',          btn: 'مشاهده محصولات',  from: 80,  to: 129 },
      { name: 'کافه',           kicker: 'ایستگاه ۳ از ۶', title: 'کافه سلامت',          text: 'قهوه‌ی تخصصی، اسموتی طبیعی و نوشیدنی رژیمی',            btn: 'منوی کافه',        from: 130, to: 199 },
      { name: 'نشیمن و پیانو',  kicker: 'ایستگاه ۴ از ۶', title: 'فضای آرامش',          text: 'بنشینید، بنوشید و از فضای گرم فروشگاه لذت ببرید',        btn: 'آدرس و ساعت کاری', from: 200, to: 319 },
      { name: 'قفسه‌های یخچالی', kicker: 'ایستگاه ۵ از ۶', title: 'تازه و روزانه',        text: 'لبنیات، نوشیدنی‌های سرد و پروتئین‌های تازه',              btn: 'سبد خرید',         from: 320, to: 399 },
      { name: 'جزیره',          kicker: 'ایستگاه ۶ از ۶', title: 'جزیره‌ی غذای سالم',   text: 'غذاهای گرم و سالادهای روزانه، آماده‌ی سرو',               btn: 'سفارش واتساپی',   from: 400, to: 560 },
    ];

    function stationForFrame(f) {
      for (let i = 0; i < STATIONS.length; i++) {
        if (f >= STATIONS[i].from && f <= STATIONS[i].to) return i;
      }
      return STATIONS.length - 1;
    }

    /* ---------- فیلم ویدیویی (نسخه‌ی زنده — اسکراب با currentTime) ---------- */
    const video = document.getElementById('stage');
    const filmWrap = document.getElementById('film-wrap');
    const cardEl = document.getElementById('card');
    let videoReady = false;
    let videoDuration = 70.166667;
    video.addEventListener('loadedmetadata', function () {
      videoDuration = video.duration || videoDuration;
      videoReady = true;
    });
    video.addEventListener('canplay', function () { videoReady = true; });

    function resizeCanvas() {
      /* موبایل: ارتفاع قاب فیلم دقیقاً = ارتفاع تصویر contain (بدون فضای خالی) */
      if (IS_MOBILE) {
        const imgH = Math.round(window.innerWidth * (360 / 640) * CONFIG.mobileZoom);
        filmWrap.style.height = imgH + 'px';
        cardEl.style.top = (imgH + 20) + 'px';
        cardEl.style.bottom = 'auto';
      }
    }
    resizeCanvas();
    window.addEventListener('resize', function () { resizeCanvas(); });

    let lastSeek = -1;
    let seeking = false;
    video.addEventListener('seeked', function () { seeking = false; });
    function scrubTo(filmProgress) {
      if (!videoReady || seeking) return;
      const t = filmProgress * videoDuration;
      if (Math.abs(t - lastSeek) < 0.08) return; /* seek اضافی نکن */
      lastSeek = t;
      seeking = true;
      try { video.currentTime = t; } catch (e) { seeking = false; }
    }

    /* ---------- منحنی اسکرول → فیلم (با فیکس میز) ---------- */
    const SCROLL_CURVE = [
      { at: 0.00, speed: 1.2 },
      { at: 0.15, speed: 0.6 },
      { at: 0.28, speed: 1.3 },
      { at: 0.42, speed: 0.6 },
      { at: 0.56, speed: 1.3 },
      { at: 0.60, speed: 0.6 }, /* قدم ۳: ناحیه‌ی آرام دور ایستگاه ۵ (قفسه‌ها) */
      { at: 0.68, speed: 0.6 },
      { at: 0.82, speed: 1.2 },
      { at: 1.00, speed: 0.5 },
    ];

    function mapScrollToProgress(scrollProgress) {
      let totalWeight = 0;
      for (let i = 0; i < SCROLL_CURVE.length - 1; i++) {
        const a = SCROLL_CURVE[i], b = SCROLL_CURVE[i + 1];
        totalWeight += (b.at - a.at) * a.speed;
      }
      let weightedSum = 0;
      for (let i = 0; i < SCROLL_CURVE.length - 1; i++) {
        const a = SCROLL_CURVE[i], b = SCROLL_CURVE[i + 1];
        const segmentLength = b.at - a.at;
        const segmentWeight = segmentLength * a.speed;
        if (scrollProgress <= b.at) {
          weightedSum += ((scrollProgress - a.at) / segmentLength) * segmentWeight;
          break;
        }
        weightedSum += segmentWeight;
      }
      return Math.min(1, Math.max(0, weightedSum / totalWeight));
    }

    /* ---------- لودر ---------- */
    const loaderEl = document.getElementById('loader');
    const loaderPct = document.getElementById('loader-pct');
    const loaderBar = document.getElementById('loader-bar');
    const loaderLabel = document.getElementById('loader-label');
    const progressFill = document.getElementById('progress-fill');
    const cardKicker = document.getElementById('card-kicker');
    const cardTitle = document.getElementById('card-title');
    const cardText = document.getElementById('card-text');
    const cardBtn = document.getElementById('card-btn');
    const stationName = document.getElementById('station-name');
    const stationDots = document.querySelectorAll('#station-bar .dot');

    let currentFrame = 0;
    let activeStation = 0;

    function toFaDigits(n) {
      return String(n).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; });
    }
    function updateLoaderUI(loaded, total, label) {
      const pct = Math.round((loaded / total) * 100);
      loaderPct.textContent = toFaDigits(pct) + '٪';
      loaderBar.style.width = pct + '%';
      if (label) loaderLabel.textContent = label;
    }

    /* ---------- کارت ایستگاه ---------- */
    function showStation(i) {
      if (i === activeStation) return;
      activeStation = i;
      const s = STATIONS[i];
      cardEl.classList.add('swap');
      setTimeout(function () {
        cardKicker.textContent = s.kicker;
        cardTitle.textContent = s.title;
        cardText.textContent = s.text;
        cardBtn.textContent = s.btn;
        stationName.textContent = s.name;
        stationDots.forEach(function (d, j) { d.classList.toggle('on', j === i); });
        cardEl.classList.remove('swap');
      }, 180);
    }


    /* ---------- قدم ۲: محصولات واقعی (بدون قیمت) ---------- */
    const PRODUCTS = [
      { id: 'pashmak',  name: 'پشمک بدون قند گزسکه',     sub: 'میان‌وعده‌ی بدون قند' },
      { id: 'honey',    name: 'عسل پروبیوتیک پروشهد',   sub: 'عسل طبیعی پروبیوتیک' },
      { id: 'coffee',   name: 'قهوه هسته خرما',          sub: 'قهوه‌ی تخصصی کافه سلامت' },
      { id: 'nugget',   name: 'ناگت غلات پاپلس',         sub: 'میان‌وعده‌ی غلات کامل' },
      { id: 'pomegran', name: 'رب انار هایپرهلس',        sub: 'رب انار طبیعی' },
      { id: 'bread',    name: 'نان یوسف',                sub: 'نان سالم' },
      { id: 'soap',     name: 'صابون گیاهی شیدرخ',       sub: 'صابون گیاهی' },
    ];
    const WA_NUMBER = '989134135317'; /* شماره‌ی سفارش واتساپی — همان سایت قبلی؛ اگر عوض شده بگویید */
    const cart = {}; /* id -> qty */

    const drawerEl = document.getElementById('drawer');
    const drawerBackdrop = document.getElementById('drawer-backdrop');
    const drawerBody = document.getElementById('drawer-body');
    const drawerTitle = document.getElementById('drawer-title');
    const drawerFooter = document.getElementById('drawer-footer');
    const waBtn = document.getElementById('wa-btn');
    const cartCount = document.getElementById('cart-count');

    function cartTotal() {
      let n = 0;
      for (const id in cart) n += cart[id];
      return n;
    }
    function updateCartBadge() {
      cartCount.textContent = toFaDigits(cartTotal());
    }
    function waLink() {
      const lines = ['سلام هایپر هلز، می‌خواهم سفارش بدهم:'];
      for (const p of PRODUCTS) {
        if (cart[p.id]) lines.push('• ' + p.name + ' × ' + cart[p.id]);
      }
      return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(lines.join('\n'));
    }
    function renderCart() {
      drawerTitle.textContent = 'سبد خرید';
      drawerFooter.style.display = '';
      const items = PRODUCTS.filter(function (p) { return cart[p.id]; });
      if (items.length === 0) {
        drawerBody.innerHTML = '<div class="empty">سبد شما خالی است.<br>از هر ایستگاه، محصول را با + اضافه کنید.</div>';
      } else {
        drawerBody.innerHTML = items.map(function (p) {
          return '<div class="prod"><div class="nm">' + p.name + '<small>' + p.sub + '</small></div>' +
            '<div class="qty"><button type="button" data-dec="' + p.id + '">−</button>' +
            '<span>' + toFaDigits(cart[p.id]) + '</span>' +
            '<button type="button" data-inc="' + p.id + '">+</button></div></div>';
        }).join('');
      }
      const total = cartTotal();
      waBtn.classList.toggle('disabled', total === 0);
      waBtn.href = total === 0 ? '#' : waLink();
      waBtn.textContent = total === 0 ? 'سفارش واتساپی' : 'سفارش واتساپی (' + toFaDigits(total) + ' قلم)';
      updateCartBadge();
    }
    function renderProducts() {
      drawerTitle.textContent = 'محصولات هایپر هلز';
      drawerFooter.style.display = '';
      drawerBody.innerHTML = PRODUCTS.map(function (p) {
        const q = cart[p.id] || 0;
        return '<div class="prod"><div class="nm">' + p.name + '<small>' + p.sub + '</small></div>' +
          '<div class="qty"><button type="button" data-dec="' + p.id + '">−</button>' +
          '<span>' + toFaDigits(q) + '</span>' +
          '<button type="button" data-inc="' + p.id + '">+</button></div></div>';
      }).join('');
      updateCartBadge();
    }
    function renderInfo() {
      drawerTitle.textContent = 'آدرس و ساعت کاری';
      drawerFooter.style.display = 'none';
      drawerBody.innerHTML =
        '<div class="info-line"><b>آدرس:</b> اصفهان، شهرک سلامت، اتوبان آقابابایی</div>' +
        '<div class="info-line"><b>ساعت کاری:</b> شنبه تا پنجشنبه ۷ تا ۲۱</div>' +
        '<div class="info-line"><b>جمعه:</b> ۸ تا ۱۴</div>' +
        '<div class="info-line"><b>ارسال:</b> دارد</div>';
    }
    function openDrawer(view) {
      if (view === 'info') renderInfo();
      else if (view === 'products') renderProducts();
      else renderCart();
      drawerEl.classList.add('open');
      drawerBackdrop.classList.add('open');
    }
    function closeDrawer() {
      drawerEl.classList.remove('open');
      drawerBackdrop.classList.remove('open');
    }
    drawerBackdrop.addEventListener('click', closeDrawer);
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    document.getElementById('cart-btn').addEventListener('click', function () { openDrawer('cart'); });
    drawerBody.addEventListener('click', function (e) {
      const inc = e.target.getAttribute('data-inc');
      const dec = e.target.getAttribute('data-dec');
      if (inc) {
        cart[inc] = (cart[inc] || 0) + 1;
        if (drawerTitle.textContent === 'سبد خرید') renderCart(); else renderProducts();
      } else if (dec) {
        cart[dec] = Math.max(0, (cart[dec] || 0) - 1);
        if (cart[dec] === 0) delete cart[dec];
        if (drawerTitle.textContent === 'سبد خرید') renderCart(); else renderProducts();
      }
    });

    /* ---------- دکمه‌های کارت ---------- */
    function cardAction() {
      const i = activeStation;
      if (i === 0) { toggleWalk(true); }
      else if (i === 3) { openDrawer('info'); }
      else if (i === 1 || i === 2) { openDrawer('products'); }
      else { openDrawer('cart'); }
    }
    cardBtn.addEventListener('click', cardAction);

    /* ---------- قدم‌زدن خودکار ---------- */
    const walkBtn = document.getElementById('walk-btn');
    let lenisRef = null;
    let walking = false;
    function toggleWalk(force) {
      if (!lenisRef) return;
      walking = (force !== undefined) ? force : !walking;
      walkBtn.textContent = walking ? '⏸' : '▶';
      walkBtn.classList.toggle('off', !walking);
      if (walking) {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        lenisRef.scrollTo(max, { duration: 45, easing: function (t) { return t; } });
      } else {
        lenisRef.stop();
        lenisRef.start();
      }
    }
    walkBtn.addEventListener('click', function () { toggleWalk(); });
    /* اسکرول دستی کاربر قدم‌زدن را متوقف می‌کند */
    window.addEventListener('wheel', function () { if (walking) toggleWalk(false); }, { passive: true });
    window.addEventListener('touchstart', function () { if (walking) toggleWalk(false); }, { passive: true });

    /* ---------- موتور اسکرول ---------- */
    function initScrollEngine() {
      gsap.registerPlugin(ScrollTrigger);
      const lenis = new Lenis({ duration: 1.15, smoothWheel: true, touchMultiplier: 1.0 });
      lenisRef = lenis;
      lenis.on('scroll', ScrollTrigger.update);
      gsap.ticker.add(function (time) { lenis.raf(time * 1000); });
      gsap.ticker.lagSmoothing(0);

      ScrollTrigger.create({
        trigger: '#scroll-spacer',
        start: 'top top',
        end: 'bottom bottom',
        scrub: true,
        onUpdate: function (self) {
          const filmProgress = mapScrollToProgress(self.progress);
          const targetFrame = Math.round(filmProgress * (TOTAL - 1));
          currentFrame = targetFrame;
          scrubTo(filmProgress);
          showStation(stationForFrame(targetFrame));
          progressFill.style.width = (self.progress * 100) + '%';
        },
      });
    }

    (async function boot() {
      updateLoaderUI(0, 100, 'در حال لود فیلم…');
      /* صبر کن تا ویدیو آماده‌ی پخش شود و بخش خوبی بافر شده باشد (حداکثر ۲۰ ثانیه) —
         seek اول باید از حافظه بیاید، نه از شبکه */
      const ready = new Promise(function (resolve) {
        let done = false;
        const finish = function () { if (!done) { done = true; resolve(); } };
        const bufferedEnough = function () {
          try {
            if (video.buffered.length > 0 && video.buffered.end(0) >= videoDuration * 0.5) return true;
          } catch (e) { /* ignore */ }
          return false;
        };
        if (video.readyState >= 2 && bufferedEnough()) { finish(); return; }
        video.addEventListener('canplaythrough', finish, { once: true });
        video.addEventListener('progress', function () { if (bufferedEnough()) finish(); });
        setTimeout(finish, 20000);
      });
      /* نوار لودر را با میزان بافر ویدیو جلو ببر */
      const tick = setInterval(function () {
        let pct = 0;
        try {
          if (video.buffered.length > 0) pct = Math.round((video.buffered.end(0) / videoDuration) * 100);
        } catch (e) { /* ignore */ }
        updateLoaderUI(Math.min(99, pct), 100, 'در حال لود فیلم…');
      }, 200);
      await ready;
      clearInterval(tick);
      try { video.currentTime = 0; } catch (e) { /* ignore */ }
      currentFrame = 0;
      updateLoaderUI(100, 100, 'آماده است');
      setTimeout(function () { loaderEl.classList.add('done'); }, 350);
      initScrollEngine();
    })();
  })();
  </script>
</body>
</html>
